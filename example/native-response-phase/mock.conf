# Demo-only services, bound to container loopback. The same single worker runs
# APISIX, the upstream and the reviewer; sleeps yield to its event loop.
lua_shared_dict audit_demo 1m;

server {
    listen 127.0.0.1:1980;
    listen 127.0.0.1:1981;
    lua_check_client_abort on;
    # Ensure the truncated Content-Length fixture actually reaches EOF.
    keepalive_timeout 0;
    default_type text/plain;

    location / {
        content_by_lua_file /demo/mock.lua;
        log_by_lua_block {
            local kind = ngx.ctx.demo_kind
            if kind then
                local dict = ngx.shared.audit_demo
                dict:incr(kind .. "_active", -1, 0)
                local outcome = ngx.ctx.demo_done and "_done" or "_cancelled"
                dict:incr(kind .. outcome, 1, 0)
            end
        }
    }

    # Actual runtime probes, rather than assumptions about filter cosockets.
    location = /capabilities {
        content_by_lua_block {
            ngx.say("probe")
        }
        header_filter_by_lua_block {
            local ok, err = pcall(ngx.socket.tcp)
            ngx.ctx.header_probe = ok and "enabled" or tostring(err)
            ngx.header.content_length = nil
        }
        body_filter_by_lua_block {
            local ok, err = pcall(ngx.socket.tcp)
            ngx.arg[1] = nil
            if ngx.arg[2] then
                ngx.arg[1] = require("cjson").encode({
                    header_filter = ngx.ctx.header_probe,
                    body_filter = ok and "enabled" or tostring(err),
                    ngx_lua = ngx.config.ngx_lua_version,
                    nginx = ngx.config.nginx_version,
                    worker_pid = ngx.worker.pid(),
                })
            end
        }
    }
}
